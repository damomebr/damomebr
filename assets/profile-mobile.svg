<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">Cristian Michelin — Da operação ao software.</title><g font-family="Avenir Next,Segoe UI,Arial,sans-serif"><rect width="720" height="560" rx="20" fill="#F1F5FA"/><path d="M0 0H720V14H0Z" fill="#284FC5"/><text x="48" y="75" font-size="24" font-weight="600" fill="#284FC5">Cristian Michelin</text><text x="48" y="158" font-size="54" font-weight="600" fill="#142A47">Da operação ao</text><text x="48" y="225" font-size="54" font-weight="600" fill="#142A47">software.</text><text x="48" y="310" font-size="25" font-weight="400" fill="#40536A">Produtos digitais, integrações e</text><text x="48" y="345" font-size="25" font-weight="400" fill="#40536A">automações com IA.</text><text x="48" y="512" font-size="21" font-weight="500" fill="#284FC5">Projetos selecionados</text></g></svg>