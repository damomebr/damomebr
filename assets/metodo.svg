<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="398" viewBox="0 0 1280 398" role="img" aria-label="Entender a operação, desenhar o sistema, entregar e evoluir."><defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1712"/><stop offset=".62" stop-color="#09110F"/><stop offset="1" stop-color="#15251B"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#B8F96C" stop-opacity=".3"/><stop offset=".54" stop-color="#4ABA87" stop-opacity=".105"/><stop offset="1" stop-color="#07100E" stop-opacity="0"/></radialGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D5FF91"/><stop offset="1" stop-color="#68D7B4"/></linearGradient>
