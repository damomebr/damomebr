 <clipPath id="clip"><rect x="0" y="0" width="680" height="921" rx="22" /></clipPath></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="680" height="921" rx="22" fill="url(#background)" stroke="none" stroke-width="1" /><rect x="0" y="0" width="680" height="921" rx="22" fill="url(#grid)" stroke="none" stroke-width="1" /><circle cx="39" cy="47" r="4" fill="#BBF763" stroke="none" stroke-width="1" /><text x="55" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" fill="#A1B5A8" font-weight="700" letter-spacing="2" text-anchor="start" >MEU JEITO DE CONSTRUIR</text><rect x="34" y="95" width="612" height="210" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="61" y="146" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >01</text><text x="62" y="203" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >ESCUTAR A OPERAÇÃO</text><text x="62" y="242" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Entender o contexto antes</text><text x="62" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >de decidir a tecnologia.</text><rect x="34" y="342" width="612" height="210" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="61" y="393" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >02</text><text x="62" y="450" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >DESENHAR O SISTEMA</text><text x="62" y="489" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Dados, regras, experiência</text><text x="62" y="515" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >e integração no mesmo mapa.</text><rect x="34" y="589" width="612" height="210" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="61" y="640" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >03</text><text x="62" y="697" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >ENTREGAR E EVOLUIR</text><text x="62" y="736" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Colocar no ar, testar</text><text x="62" y="762" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >e aprender com o uso.</text><circle cx="339" cy="321" r="14" fill="#1D3227" stroke="#BBF763" stroke-width="1.1" /><path d="M339 316 v10 m-5 -5 5 5 5 -5" stroke="#BBF763" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="339" cy="568" r="14" fill="#1D3227" stroke="#BBF763" stroke-width="1.1" /><path d="M339 563 v10 m-5 -5 5 5 5 -5" stroke="#BBF763" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />