 <clipPath id="clip"><rect x="0" y="0" width="1280" height="398" rx="22" /></clipPath></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1280" height="398" rx="22" fill="url(#background)" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1280" height="398" rx="22" fill="url(#grid)" stroke="none" stroke-width="1" /><circle cx="40" cy="45" r="4" fill="#BBF763" stroke="none" stroke-width="1" /><text x="56" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" fill="#A1B5A8" font-weight="700" letter-spacing="2" text-anchor="start" >MEU JEITO DE CONSTRUIR</text><text x="1247" y="51" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" fill="#A1B5A8" font-weight="750" letter-spacing="1" text-anchor="end" >DO PROBLEMA REAL AO SISTEMA EM USO</text><rect x="31" y="87" width="380" height="205" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="58" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >01</text><text x="59" y="195" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >ESCUTAR A OPERAÇÃO</text><text x="59" y="234" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Entender o contexto antes</text><text x="59" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >de decidir a tecnologia.</text><rect x="450" y="87" width="380" height="205" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="477" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >02</text><text x="478" y="195" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >DESENHAR O SISTEMA</text><text x="478" y="234" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Dados, regras, experiência</text><text x="478" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >e integração no mesmo mapa.</text><rect x="869" y="87" width="380" height="205" rx="16" fill="url(#glass)" stroke="#3B5A46" stroke-width="1" /><text x="896" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" fill="#BBF763" font-weight="820" letter-spacing="-1" text-anchor="start" >03</text><text x="897" y="195" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" fill="#EFF8F0" font-weight="800" letter-spacing="0" text-anchor="start" >ENTREGAR E EVOLUIR</text><text x="897" y="234" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >Colocar no ar, testar</text><text x="897" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" fill="#A1B5A8" font-weight="500" letter-spacing="0" text-anchor="start" >e aprender com o uso.</text><circle cx="426" cy="191" r="17" fill="#1D3227" stroke="#BBF763" stroke-width="1.2" /><path d="M 422 185 l 7 6 -7 6" stroke="#BBF763" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="845" cy="191" r="17" fill="#1D3227" stroke="#BBF763" stroke-width="1.2" /><path d="M 841 185 l 7 6 -7 6" stroke="#BBF763" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="33" y1="332" x2="1247" y2="332" stroke="#3A5945" stroke-width="1" /><text x="35" y="368" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="24" fill="#EFF8F0" font-weight="650" letter-spacing="0" text-anchor="start" >“Não é sobre a stack. É sobre o que a stack resolve.”</text><text x="1246" y="367" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" fill="#BBF763" font-weight="780" letter-spacing="1" text-anchor="end" >CRISTIAN MICHELIN</text></g><rect x="1" y="1" width="1278" height="396" rx="21" fill="none" stroke="#30463B" stroke-width="1" /></svg>